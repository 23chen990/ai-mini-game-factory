<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#103f37"><title>午间门诊</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app" class="app">
<header class="top"><div class="brand"><span class="brand-icon">+</span><b>午间门诊</b></div><div class="hud"><span class="cash"><small>资金</small><b id="cash">¥80</b></span><span><small>剩余</small><b id="clock">3:00</b></span></div><button id="pause" class="icon-button" aria-label="暂停">Ⅱ</button></header>
<section class="mission" aria-live="polite"><div class="mission-mark" id="mission-step">1</div><div class="mission-text"><strong id="hint">先帮挂号台消化长队</strong><small id="why">点场景中的挂号台，助理就会过去</small></div><span class="mission-chevron">↓</span></section>
<div class="wavebar"><span id="phase-label">初诊登记</span><span id="forecast"></span><span id="orientation-tip">点房间调助理</span></div>
<section class="scene" aria-label="点房间即可调度" id="scene"><div class="floor-grid"></div><div class="zones">
<button class="zone intake" id="assign-intake" aria-label="点挂号台，派助理支援" aria-pressed="false"><span class="room-heading"><b>挂号台</b><small id="intake-status">登记资料</small></span><span class="desk"><i>护</i><em></em></span><span class="service-meter"><i id="intake-progress"></i></span><span class="queue-sign"><b id="intake-count">0</b> 人等待 <em id="intake-deadline"></em></span><span class="tap-cue">点这里调人</span></button>
<button class="zone care" id="assign-care" aria-label="点诊室，派助理支援" aria-pressed="false"><span class="room-heading"><b>一号诊室</b><small id="care-status">完成诊疗</small></span><span class="desk"><i>医</i><em>+</em></span><span class="service-meter"><i id="care-progress"></i></span><span class="queue-sign"><b id="care-count">0</b> 人等待 <em id="care-deadline"></em></span><span class="tap-cue">点这里调人</span></button>
<button class="zone expansion" id="open-expansion" aria-label="查看二号诊室建设"><span class="room-heading"><b id="second-title">增开诊位</b><small id="second-status">空地</small></span><span class="build-mark" id="build-mark">+</span><span class="expansion-cost" id="expansion-cost">房间 + 医生<br><b>¥135</b></span><span class="tap-cue">点击查看</span></button>
</div><div class="flow-arrow" aria-hidden="true">→</div><div id="people" aria-hidden="true"></div><div id="helper" class="helper" aria-hidden="true"><span>助</span><small id="helper-effect"></small></div><div id="toast" class="toast" role="status"></div></section>
<section class="goalbar"><span>接诊 <b id="served">0/26</b></span><div class="goal-track"><i id="goal-progress"></i></div><span class="loss-counter">等不及离开 <b id="lost">0/5</b></span></section>
<section class="context" id="context"><div class="context-info"><b id="context-title">一位助理，两个岗位</b><p id="last-action">点挂号台或诊室调人，不用拖拽小人。</p><small id="investment-note"></small></div><button id="buy-equipment" class="context-action" hidden>升级设备 <b>¥35</b></button><button id="buy-room" class="context-action" hidden>建诊室 <b>¥65</b></button><button id="buy-doctor" class="context-action" hidden>聘医生 <b>¥70</b></button></section>
<small id="save-state" class="save-state">自动保存 · 离开即暂停</small>
<div id="overlay" class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><small class="eyebrow">一个忙而可控的午间班</small><h1 id="dialog-title">长队来了，<br>你来安排。</h1><p id="dialog-text">点房间调助理，让等待的人动起来。</p><div class="promise" id="promise"><span><b>3</b> 分钟</span><span><b>26</b> 人接诊</span><span>最多 <b>5</b> 人离开</span></div><div id="settlement" hidden></div><p id="best-note" hidden></p><button id="start" class="primary">开诊 →</button><button id="restart" class="secondary" hidden>重开这一班</button><small class="dialog-note">横屏视野更宽 · 随时暂停 · 无广告无付费</small></section></div>
</main><script type="module" src="main.mjs"></script></body></html>
