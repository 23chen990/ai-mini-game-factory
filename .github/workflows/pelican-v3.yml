name: Pelican real-game regression
on:
  pull_request:
    paths:
      - 'tools/lean-pilot/pelican-v2/**'
      - 'docs/lean-pilot/pelican-feel-v3-20261014/**'
      - 'docs/lean-pilot/pelican-fun-v4-20261016/**'
      - '.github/workflows/pelican-v3.yml'
      - 'package.json'
permissions:
  contents: read
concurrency:
  group: pelican-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  v7-model-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Fast native physical model regression
        run: |
          node --test tools/lean-pilot/pelican-v2/core.node.mjs tools/lean-pilot/pelican-v2/runtime/*.node.mjs
          node tools/lean-pilot/pelican-v2/difficulty-audit.mjs
      - name: Export isolated source snapshot for V7 diagnostics
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/pelican-v7-source.tgz" tools/lean-pilot/pelican-v2 package.json .github/workflows/pelican-v3.yml
      - name: Keep exact-checkout model sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pelican-v7-sources-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pelican-v7-source.tgz
          retention-days: 2
          if-no-files-found: error
  pelican-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    env:
      QA_ENGINE: ${{ matrix.engine }}
      # Software runner functional input coverage. Local perceptual/quality
      # captures label their actual DPR/native GPU and are archived separately.
      QA_DPR: 1
      QA_USE_MESA: 1
      # Existing menu preset via trusted taps; game speed/collision unchanged.
      QA_TOUCH_QUALITY: efficient
      # Shipped accessibility CSS. Native-GPU default-animation evidence is
      # reviewed separately; retain the failed default software profile too.
      QA_TOUCH_MOTION: reduce
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Install locked toolchain
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps $QA_ENGINE
      - name: Actual Pelican rules, integration contract, lint and typecheck
        run: |
          pnpm run pilot:pelican:test
          pnpm exec eslint tools/lean-pilot/pelican-v2
          pnpm exec tsc --noEmit
      # Deterministic physical no-input baselines are an engineering oracle,
      # NOT a claim about first-time players, ad intent, or human fail rates.
      - name: Measure hard-mode skill gap and no-input failure baseline
        run: node tools/lean-pilot/pelican-v2/difficulty-audit.mjs
      - name: Fetch the immutable authorized source
        run: |
          mkdir -p "$RUNNER_TEMP/pelican-source"
          git -C "$RUNNER_TEMP/pelican-source" init -q
          git -C "$RUNNER_TEMP/pelican-source" remote add origin https://github.com/riba2534/claude-opus-5-5-demo.git
          git -C "$RUNNER_TEMP/pelican-source" fetch --depth=1 origin 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          git -C "$RUNNER_TEMP/pelican-source" checkout --detach FETCH_HEAD
      - name: Fresh isolated Pelican build with source and attempt receipts
        run: |
          test ! -e runs/pelican-coast-v2-20261014/baseline-receipt.json
          test ! -e runs/pelican-coast-v2-20261014/repair-state.json
          H5_PINNED_SOURCE_ROOT="$RUNNER_TEMP/pelican-source" node tools/lean-pilot/pelican-v2/prepare.mjs
          REPAIR_HYPOTHESIS='CI fresh V3 immutable-source build; isolated from developer repair history' node tools/lean-pilot/pelican-v2/build.mjs
      - name: V6 real H5 endless, cosmetic and earned-wallet persistence
        run: xvfb-run -a node tools/lean-pilot/pelican-v2/v6-qa.mjs
      # Run the fragile player-visible jump/reward journey first for faster
      # diagnostic feedback; all campaign and risk gates still run afterwards.
      - name: Real touch swipes, cancel, jump choice and first-minute feedback
        run: |
          xvfb-run -a node tools/lean-pilot/pelican-v2/experience-qa.mjs
          QA_V7_QUICK=1 xvfb-run -a node tools/lean-pilot/pelican-v2/v7-journey-qa.mjs
      # Execute the post-pedestrian normal-input crash path before the long
      # five-level run; do not omit it or skip any earned unlock prerequisite.
      - name: Legacy collision and jump regressions with legitimate V4 detours
        run: xvfb-run -a node tools/lean-pilot/pelican-v2/qa.mjs collisions
      # Risk/true-reward integrity remains a first-class product gate and
      # still runs before the independent full five-level default campaign.
      - name: Five earned three-star routes and every exact jump reward including new V4 barriers
        run: xvfb-run -a node tools/lean-pilot/pelican-v2/risk-qa.mjs
      - name: Real default-speed touch campaign, five earned unlocks and replay
        run: xvfb-run -a node tools/lean-pilot/pelican-v2/qa.mjs campaign
      - name: Real V4 deaths, unavailable revive, free replay, pause and save accounting
        run: xvfb-run -a node tools/lean-pilot/pelican-v2/v4-qa.mjs
      # Deliver the exact already-tested Chromium H5 for internal phone review.
      # A browser-only build is not a public release or a real device sign-off.
      - name: Package verified internal-playtest H5
        if: ${{ success() && matrix.engine == 'chromium' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pelican-v7-playtest-${{ github.event.pull_request.head.sha }}
          path: runs/pelican-coast-v2-20261014/workspace/game/index.html
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pelican-v3-${{ matrix.engine }}-${{ github.event.pull_request.head.sha }}
          path: |
            runs/pelican-coast-v2-20261014/baseline-receipt.json
            runs/pelican-coast-v2-20261014/build-receipt.json
            runs/pelican-coast-v2-20261014/repair-state.json
            runs/pelican-coast-v2-20261014/attempts/**
          retention-days: 14
          if-no-files-found: error
