name: Existing game external audit
on:
  push:
    branches: [feat/existing-game-external-audit-20261012]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Browser engines for runtime tests
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: New external audit gates
        run: pnpm exec vitest run tests/unit/existing-game-audit.test.ts
      - name: Full factory regression
        run: pnpm test
