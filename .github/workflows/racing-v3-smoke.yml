name: Racing V3 H5 build and Chromium entry smoke
on:
  pull_request:
    paths:
      - 'templates/web-lite/h5-source-mobile-v1/**'
      - 'tools/lean-pilot/racing-mobile-build.mjs'
      - 'tools/lean-pilot/racing-car-*.mjs'
      - 'tools/lean-pilot/racing-wheel-qa-input.mjs'
      - 'tools/lean-pilot/tests/racing-car-*.mjs'
      - 'tools/lean-pilot/tests/racing-wheel-qa-input.node.mjs'
      - 'tools/lean-pilot/tests/racing-home-presentation.node.mjs'
      - 'tools/lean-pilot/racing-v3-smoke.mjs'
      - 'tools/lean-pilot/racing-geometry-audit.mjs'
      - 'tools/lean-pilot/racing-shortcut-cost.mjs'
      - 'tools/lean-pilot/tests/racing-shortcut-cost.test.mjs'
      - 'tools/lean-pilot/racing-ai-pace-audit.mjs'
      - 'tools/lean-pilot/racing-native-player-qa.mjs'
      - 'tools/lean-pilot/racing-fuel-lifecycle-qa.mjs'
      - 'tools/lean-pilot/racing-career-qa.mjs'
      - 'tools/lean-pilot/racing-integrated-campaign-audit.mjs'
      - 'tools/lean-pilot/racing-visible-policy.mjs'
      - 'tools/lean-pilot/racing-mobile-experience-qa.mjs'
      - 'tools/lean-pilot/racing-delivery-verify.mjs'
      - 'tools/lean-pilot/racing-delivery-verify.test.mjs'
      - 'tools/lean-pilot/tests/racing-visible-policy.test.mjs'
      - '.github/workflows/racing-v3-smoke.yml'
  workflow_dispatch:
    inputs:
      natural_touch:
        description: 'Run slow (non-gating) visible-touch diagnostic on software WebGL'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: racing-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  racing-v3:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/racing-career-items-iaa-20261014' || github.event.pull_request.head.ref == 'feat/racing-v31-tracks-items-recovery-20261014' || github.event.pull_request.head.ref == 'chatgpt/racing-arcade-ux-20261016' || github.event.pull_request.head.ref == 'chatgpt/racing-rivals-map-verification-20261016' || github.event.pull_request.head.ref == 'chatgpt/racing-classic-countersteer-20261016' || github.event.pull_request.head.ref == 'chatgpt/racing-v46-challenge-20261017' || (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.event.pull_request.head.ref, 'chatgpt/racing-v5') || (startsWith(github.event.pull_request.head.ref, 'feat/racing-v60-') || (startsWith(github.event.pull_request.head.ref, 'chatgpt/racing-v61-') || (startsWith(github.event.pull_request.head.ref, 'chatgpt/racing-v62-') || startsWith(github.event.pull_request.head.ref, 'chatgpt/racing-v70-') || startsWith(github.event.pull_request.head.ref, 'feat/racing-v8-') || startsWith(github.event.pull_request.head.ref, 'chatgpt/racing-v91-') || startsWith(github.event.pull_request.head.ref, 'chatgpt/racing-v9-') || startsWith(github.event.pull_request.head.ref, 'codex/hunyuan-racer-'))))))
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Locked factory dependencies only
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Locked racing code tests and TypeScript/lint
        run: |
          node --test templates/web-lite/h5-source-mobile-v1/tests/*.test.mjs
          node --test tools/lean-pilot/tests/racing-build.test.mjs
          node --test tools/lean-pilot/tests/racing-car-build.node.mjs tools/lean-pilot/tests/racing-car-prepare.node.mjs tools/lean-pilot/tests/racing-wheel-qa-input.node.mjs tools/lean-pilot/tests/racing-home-presentation.node.mjs
          node --test tools/lean-pilot/tests/racing-shortcut-cost.test.mjs
          node --test tools/lean-pilot/tests/racing-visible-policy.test.mjs
          node --test tools/lean-pilot/racing-delivery-verify.test.mjs
          pnpm exec eslint tools/lean-pilot/racing-shortcut-cost.mjs tools/lean-pilot/tests/racing-shortcut-cost.test.mjs tools/lean-pilot/racing-native-player-qa.mjs tools/lean-pilot/racing-ai-pace-audit.mjs tools/lean-pilot/racing-geometry-audit.mjs tools/lean-pilot/racing-mobile-build.mjs tools/lean-pilot/racing-v3-smoke.mjs tools/lean-pilot/racing-career-qa.mjs tools/lean-pilot/racing-visible-policy.mjs tools/lean-pilot/racing-mobile-experience-qa.mjs templates/web-lite/h5-source-mobile-v1/racing templates/web-lite/h5-source-mobile-v1/fuel.mjs
          pnpm exec eslint tools/lean-pilot/racing-car-*.mjs tools/lean-pilot/racing-wheel-qa-input.mjs tools/lean-pilot/tests/racing-car-*.mjs tools/lean-pilot/tests/racing-wheel-qa-input.node.mjs tools/lean-pilot/tests/racing-home-presentation.node.mjs
          pnpm typecheck
      - name: Obtain the exact pinned public racing reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/racing-source"
          git -C "$RUNNER_TEMP/racing-source" init -q
          git -C "$RUNNER_TEMP/racing-source" remote add origin https://github.com/riba2534/claude-opus-5-5-demo.git
          git -C "$RUNNER_TEMP/racing-source" fetch --no-tags --depth=1 origin 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          git -C "$RUNNER_TEMP/racing-source" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/racing-source" rev-parse HEAD)" = '54adc1fb64155f9dd7c1c90ecae7b8185ac540b8'
          git -C "$RUNNER_TEMP/racing-source" diff --exit-code
      - name: Build V3 racing actual standalone and H5
        env:
          H5_PINNED_SOURCE_ROOT: ${{ runner.temp }}/racing-source
        run: node tools/lean-pilot/racing-mobile-build.mjs
      - name: Verify real Three car materials, shared resources and independent pivots
        run: RACE_THREE_MODULE="$PWD/runs/h5-qq-mobile-20261013/workspace/source/qq-speed/node_modules/three/build/three.module.js" node --test tools/lean-pilot/tests/racing-car-model-runtime.mjs
      - name: Verify actual H5 build includes every racing runtime source
        run: node --test tools/lean-pilot/racing-build-fingerprint-check.mjs
      - name: Audit all four original/reshaped native centerlines
        run: node tools/lean-pilot/racing-geometry-audit.mjs
      - name: Compare two native AI laps on original and reshaped tracks
        run: node tools/lean-pilot/racing-ai-pace-audit.mjs
      - name: Compare real pinned PlayerCar/Track physics under synthetic two-button steering
        run: node tools/lean-pilot/racing-native-player-qa.mjs
      - name: Install matching Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Launch actual bundled WebGL racing in Chromium
        run: |
          node --test tools/lean-pilot/racing-fuel-lifecycle-qa.mjs
          node tools/lean-pilot/racing-v3-smoke.mjs runs/h5-qq-mobile-20261013/workspace/game runs/h5-qq-mobile-20261013/artifacts/racing-v3-smoke
      - name: One-stage natural visible-touch diagnostic (non-gating)
        if: github.event_name == 'workflow_dispatch' && inputs.natural_touch == true
        continue-on-error: true
        env:
          RACE_QA_HEADLESS: '1'
          RACE_QA_STAGES: '1'
          RACE_QA_MAX_MS: '480000'
          RACE_QA_DIAGNOSTIC_RACE_SECS: '25'
          RACE_QA_LABEL: 'v32-natural-ci'
        run: node tools/lean-pilot/racing-career-qa.mjs
      - name: Native 30-stage + daily integrated simulation (synthetic, non-gating)
        continue-on-error: true
        timeout-minutes: 11
        env:
          RACE_SWEEP_STAGES: '31'
          RACE_SWEEP_MAX_WALL_MS: '600000'
        run: |
          node --check tools/lean-pilot/racing-integrated-campaign-audit.mjs
          node tools/lean-pilot/racing-integrated-campaign-audit.mjs
      - name: Package playable H5 evidence, hashes and demo ZIP
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir=runs/h5-qq-mobile-20261013
          mkdir -p "$dir/artifacts/racing-v3-delivery"
          if test -f "$dir/workspace/game/index.html"; then
            (
              cd "$dir/workspace/game"
              zip -q -r "$OLDPWD/$dir/artifacts/racing-v3-delivery/qq-speed-v3-h5.zip" ./
            )
            sha256sum "$dir/artifacts/racing-v3-delivery/qq-speed-v3-h5.zip" > "$dir/artifacts/racing-v3-delivery/SHA256SUMS.txt"
          fi
          if test -f "$dir/artifacts/build-racing.json"; then
            cp "$dir/artifacts/build-racing.json" "$dir/artifacts/racing-v3-delivery/build-racing.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: racing-v3-h5-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            runs/h5-qq-mobile-20261013/artifacts/racing-v3-delivery/*
            runs/h5-qq-mobile-20261013/artifacts/racing-v3-smoke/*
            runs/h5-qq-mobile-20261013/evidence/v32-natural-ci/*
          retention-days: 7
          if-no-files-found: warn

  publish-qa-preview:
    name: Verified H5 phone preview (QA only)
    needs: racing-v3
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'chatgpt/racing-v70-iaa-short-session-20261017' || github.event.pull_request.head.ref == 'feat/racing-v8-full-experience-20261017' || github.event.pull_request.head.ref == 'chatgpt/racing-v91-wheel-hud-20261017' || github.event.pull_request.head.ref == 'chatgpt/racing-v9-course-craft-20261017') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      RACE_QA_BRANCH: ${{ github.event.pull_request.head.ref == 'chatgpt/racing-v91-wheel-hud-20261017' && 'preview/racing-v91-wheel-hud-20261017' || (github.event.pull_request.head.ref == 'chatgpt/racing-v9-course-craft-20261017' && 'preview/racing-v90-integrated-20261017') || (github.event.pull_request.head.ref == 'feat/racing-v8-full-experience-20261017' && 'preview/racing-v80-integrated-20261017' || 'preview/racing-v70-iaa-short-session-20261017') }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Fetch exact same-run racing QA artifact
        uses: actions/download-artifact@v4
        with:
          name: racing-v3-h5-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/racing-payload
      - name: Assemble and verify one-file H5 from immutable CI package
        env:
          RACE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          packages = list((root/'racing-payload').rglob('qq-speed-v3-h5.zip'))
          if len(packages) != 1:
              raise SystemExit('Require exactly one racing game ZIP from THIS successful workflow run')
          folder = packages[0].parent
          meta = json.loads((folder/'build-racing.json').read_text())
          if meta.get('publishable') is not False or meta.get('gameId') != 'qq-speed':
              raise SystemExit('Not an internal-only qq-speed game build')
          if meta.get('sourceRevision') != '54adc1fb64155f9dd7c1c90ecae7b8185ac540b8':
              raise SystemExit('Unpinned racing upstream; refuse deployment')
          with zipfile.ZipFile(packages[0]) as z:
              html = z.read('index.html').decode('utf8')
              css = z.read('style.css').decode('utf8')
          anchor = '<link rel="stylesheet" href="style.css">'
          if html.count(anchor) != 1 or 'data-race-mobile="true"' not in html:
              raise SystemExit('Wrong runtime entrypoint or unexpected HTML')
          standalone = html.replace(anchor, '<style>' + css + '</style>')
          digest = hashlib.sha256(standalone.encode('utf8')).hexdigest()
          if digest != meta['trialSha256'] or len(standalone) < 100000:
              raise SystemExit('Standalone differs from QA build hash')
          target = root/'racing-verified'
          target.mkdir(exist_ok=True)
          (target/'index.html').write_text(standalone, encoding='utf8')
          (target/'PREVIEW_PROVENANCE.txt').write_text(
              'INTERNAL HUMAN PLAYTEST ONLY - NOT LICENSED COMMERCIAL RELEASE\n'
              + 'SOURCE_COMMIT=' + os.environ['RACE_SOURCE_SHA'] + '\n'
              + 'UPSTREAM_COMMIT=' + meta['sourceRevision'] + '\n'
              + 'BUILD_SHA256=' + meta['buildHash'] + '\n'
              + 'HTML_SHA256=' + digest + '\n', encoding='utf8')
          print('QA_ARTIFACT_VERIFIED_HTML_SHA256=' + digest)
          PY
      - name: Publish SHA-verified V7/V8 private playtest to correct isolated QA branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$RACE_QA_BRANCH"
          preview="$RUNNER_TEMP/racing-preview-wt"
          git worktree add --detach "$preview" FETCH_HEAD
          cp "$RUNNER_TEMP/racing-verified/index.html" "$preview/index.html"
          cp "$RUNNER_TEMP/racing-verified/PREVIEW_PROVENANCE.txt" "$preview/PREVIEW_PROVENANCE.txt"
          git -C "$preview" config user.name "github-actions[bot]"
          git -C "$preview" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$preview" add index.html PREVIEW_PROVENANCE.txt
          if git -C "$preview" diff --cached --quiet; then
            echo 'PREVIEW_UNCHANGED=1' >> "$GITHUB_STEP_SUMMARY"
          else
            git -C "$preview" commit -m "test(racing-preview): SHA-verified H5 from ${{ github.event.pull_request.head.sha }}"
            git -C "$preview" push origin "HEAD:refs/heads/$RACE_QA_BRANCH"
          fi
          echo 'Preview branch updated; external HTTP hash gate runs separately.' >> "$GITHUB_STEP_SUMMARY"
          echo "https://raw.githack.com/23chen990/ai-mini-game-factory/$RACE_QA_BRANCH/index.html" >> "$GITHUB_STEP_SUMMARY"
