name: External game QA verifier
on:
  push:
    branches: [feat/external-game-audit-20261012]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck-and-external-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
