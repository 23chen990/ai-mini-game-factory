name: Lean pilot verification
on:
  pull_request:
    paths:
      - 'tools/lean-pilot/**'
      - 'templates/web-lite/grid-merge-v1/**'
      - 'templates/web-lite/clinic-queue-v1/**'
      - 'templates/web-lite/h5-source-mobile-v1/**'
      - 'eslint.config.js'
      - 'examples/lean-pilot/**'
      - 'docs/lean-pilot/**'
      - 'PILOT_START.md'
      - '.github/workflows/lean-pilot.yml'
      - 'package.json'
      - 'src/cli/factory.ts'
      - '.agents/skills/gameplay-loop-review/**'
      - '.agents/skills/seed-to-game-blueprint/SKILL.md'
      - '.agents/skills/game-playtest/SKILL.md'
permissions:
  contents: read
concurrency:
  group: lean-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Check narrowly approved change scope
        run: npm run pilot:scope
      - name: Native tests including delayed single-action negative baselines
        shell: bash
        run: npm run pilot:test | tee "$RUNNER_TEMP/lean-pilot-native.tap"
      - name: Clinic deterministic rule and strategy tests
        run: node --test templates/web-lite/clinic-queue-v1/tests/engine.test.mjs
      - name: Owned H5 glue and ad lifecycle fixtures (no reference code or live ads)
        run: node --test templates/web-lite/h5-source-mobile-v1/tests/*.test.mjs
      - name: Check browser and tooling syntax
        run: |
          for file in tools/lean-pilot/*.mjs templates/web-lite/grid-merge-v1/*.mjs templates/web-lite/clinic-queue-v1/*.mjs templates/web-lite/h5-source-mobile-v1/*.mjs .agents/skills/gameplay-loop-review/scripts/*.mjs; do
            node --check "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lean-native-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/lean-pilot-native.tap
          retention-days: 7
          if-no-files-found: warn
  http-browser:
    needs: offline-engineering
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Install the repository package manager
        run: npm install --global pnpm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install existing locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record versions and typecheck existing merge candidate
        run: |
          node --version
          pnpm --version
          pnpm exec playwright --version
          sha256sum pnpm-lock.yaml
          npm run pilot:typecheck
          pnpm exec eslint tools/lean-pilot templates/web-lite/grid-merge-v1 templates/web-lite/clinic-queue-v1 templates/web-lite/h5-source-mobile-v1 .agents/skills/gameplay-loop-review/scripts src/cli/factory.ts
      - name: Verify the real shared factory CLI without starting a provider
        run: node tools/lean-pilot/workflow-integration.mjs
      - name: Install Chromium for the locked Playwright version
        run: pnpm exec playwright install --with-deps chromium
      - name: Initialize original merge candidate and verify its copied core
        run: |
          npm run pilot -- init ci-pilot observatory
          npm run pilot -- check ci-pilot
      - name: Preserve original HTTP input and persistence regression
        run: npm run pilot:browser -- ci-pilot
      - name: Export original review files
        run: |
          npm run pilot -- export ci-pilot observatory
          npm run pilot -- export ci-pilot orchard
      - name: Build the active-dispatch clinic from the mobile experience contract
        run: |
          npm run pilot -- build ci-clinic
          node tools/lean-pilot/clinic-balance.mjs ci-clinic > runs/ci-clinic/strategy-comparison.json
      - name: Scene controls, negative baselines and full default-speed HTTP shift before delivery
        run: |
          npm run pilot -- prepare ci-clinic
          npm run pilot -- delivery ci-clinic
          node tools/lean-pilot/runner.mjs handoff ci-clinic > runs/ci-clinic/handoff.json
      - name: Two known regressions repaired before a real default-speed recheck
        run: node tools/lean-pilot/quality-challenge.mjs ci-quality-challenge
      - name: Write honest gate reports even after failure
        if: always()
        shell: bash
        run: |
          for id in ci-pilot ci-clinic ci-quality-challenge; do
            if test -f runs/$id/run.json; then
              node tools/lean-pilot/runner.mjs report "$id" > "runs/$id/report.json"
              cat "runs/$id/report.json"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lean-browser-${{ github.event.pull_request.head.sha }}
          path: |
            runs/ci-pilot/engineering.json
            runs/ci-pilot/engineering.tap
            runs/ci-pilot/browser.json
            runs/ci-pilot/report.json
            runs/ci-pilot/screenshots/*.png
            runs/ci-pilot/*.html
            runs/ci-clinic/engineering.json
            runs/ci-clinic/browser.json
            runs/ci-clinic/report.json
            runs/ci-clinic/strategy-comparison.json
            runs/ci-clinic/clinic-trace.json
            runs/ci-clinic/handoff.json
            runs/ci-clinic/screenshots/*.png
            runs/ci-clinic/quality/*.json
            runs/ci-clinic/quality/*.html
            runs/ci-clinic/quality/visible-*/*.png
            runs/ci-quality-challenge/quality/*.json
            runs/ci-quality-challenge/quality/visible-*/*.png
          retention-days: 7
          if-no-files-found: warn

  # Ephemeral, branch-gated REAL tool research. No merges, deploys or credentials.
  three-h5-real-rea:
    if: github.event.pull_request.head.ref == 'research/three-h5-rea-taptap-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Audit pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/three-h5-results" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" init -q
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/riba2534/claude-opus-5-5-demo.git
          git -C "$RUNNER_TEMP/upstream" fetch --no-tags --depth=1 origin 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          git -C "$RUNNER_TEMP/upstream" checkout -q FETCH_HEAD
          node tools/lean-pilot/three-h5-research.mjs anchors "$RUNNER_TEMP/upstream" "$RUNNER_TEMP/three-h5-results/pinned-source.json"
      - name: Install REA 6.4.0 only into runner temp
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rea" --ignore-scripts --no-audit --no-fund --no-save --package-lock=false rea-agents@6.4.0
          "$RUNNER_TEMP/rea/node_modules/.bin/rea" --version
      - name: Actual REA on owned static JavaScript fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/own-smoke"
          printf '%s\n' '{"name":"owned-rea-smoke","version":"1.0.0","private":true}' > "$RUNNER_TEMP/own-smoke/package.json"
          printf '%s\n' 'export function calc(a,b){return a+b}; export const value=calc(2,3)' > "$RUNNER_TEMP/own-smoke/app.js"
          "$RUNNER_TEMP/rea/node_modules/.bin/rea" analyze-javascript-application "$RUNNER_TEMP/own-smoke" --json --analysis-timeout-ms 45000 --max-heap-mb 256 > "$RUNNER_TEMP/smoke-rea.json" 2> "$RUNNER_TEMP/smoke-progress.log"
          node -e 'const f=require("node:fs"),r=JSON.parse(f.readFileSync(process.argv[1],"utf8"));if(!r.evidence_id||!r.normalized_result)process.exit(1);f.writeFileSync(process.argv[2],JSON.stringify({status:"REAL_REA_SMOKE_PASS",evidenceId:r.evidence_id},null,2));console.log("REAL_REA_SMOKE_PASS",r.evidence_id)' "$RUNNER_TEMP/smoke-rea.json" "$RUNNER_TEMP/three-h5-results/own-smoke.json"
      - name: Blind static REA on the three supplied CDN games
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          mkdir -p "$RUNNER_TEMP/three-h5-artifacts"
          for game in qq-speed cf-transport-ship pelican-bike; do
            case "$game" in
              qq-speed) url="https://lf3-static.bytednsdoc.com/obj/eden-cn/nulojnulwlo/qqfeiche3d/index.html" ;;
              cf-transport-ship) url="https://lf3-static.bytednsdoc.com/obj/eden-cn/nulojnulwlo/cf-transport-ship/transport-ship.html" ;;
              pelican-bike) url="https://lf3-static.bytednsdoc.com/obj/eden-cn/nulojnulwlo/pelican-bike/index.html" ;;
            esac
            if ! curl --fail --location --silent --show-error --retry 1 --connect-timeout 12 --max-time 70 "$url" -o "$RUNNER_TEMP/three-h5-artifacts/$game.html"; then
              echo "REFERENCE_DOWNLOAD_FAILED $game"; failures=$((failures+1)); continue
            fi
            if ! node tools/lean-pilot/three-h5-research.mjs stage "$game" "$RUNNER_TEMP/three-h5-artifacts/$game.html" "$RUNNER_TEMP/three-h5-artifacts/$game" "$RUNNER_TEMP/three-h5-results/$game-stage.json"; then
              failures=$((failures+1)); continue
            fi
            start=$(date +%s)
            set +e
            "$RUNNER_TEMP/rea/node_modules/.bin/rea" analyze-javascript-application "$RUNNER_TEMP/three-h5-artifacts/$game" --integrity-policy fail --analysis-timeout-ms 85000 --max-heap-mb 768 --json > "$RUNNER_TEMP/three-h5-artifacts/$game-rea.json" 2> "$RUNNER_TEMP/three-h5-artifacts/$game-rea-progress.log"
            code=$?
            set -e
            echo "REA_GAME $game EXIT $code ELAPSED_SECONDS $(($(date +%s)-start))"
            if [ "$code" -ne 0 ]; then sed -n '1,12p' "$RUNNER_TEMP/three-h5-artifacts/$game-rea-progress.log" | sed -E 's@(/home/runner/[^ ]+)@[private-path]@g'; fi
            if ! node tools/lean-pilot/three-h5-research.mjs receipt "$game" "$RUNNER_TEMP/three-h5-artifacts/$game-rea.json" "$code" "$RUNNER_TEMP/three-h5-results/$game-stage.json" "$RUNNER_TEMP/three-h5-results/$game-rea-receipt.json"; then
              failures=$((failures+1))
            fi
          done
          test "$failures" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: three-h5-rea-receipts-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/three-h5-results/*.json
          retention-days: 7
          if-no-files-found: warn

  # V12 product branch only: independent original-3D touch gate, not a mock
  # scene, native win injection, public deployment or platform approval.
  cf-v12-native-mobile-3d:
    if: github.event.pull_request.head.ref == 'feat/cf-v12-mobile-touch-recovery-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_ID: h5-cf-challenges-20261013
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Locked existing dependencies and Chromium
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Test native-touch regression, lint and types
        run: |
          node --check tools/lean-pilot/cf-v12-native-qa.mjs
          node --test templates/web-lite/h5-source-mobile-v1/tests/*.test.mjs
          pnpm exec eslint tools/lean-pilot/cf-v12-native-qa.mjs templates/web-lite/h5-source-mobile-v1/*.mjs templates/web-lite/h5-source-mobile-v1/tests/*.test.mjs
          npm run pilot:typecheck
      - name: Fetch immutable source for original real 3D world
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/cf-v12-source"
          mkdir -p "$source_root"
          git -C "$source_root" init -q
          git -C "$source_root" remote add origin https://github.com/riba2534/claude-opus-5-5-demo.git
          git -C "$source_root" fetch --no-tags --depth=1 origin 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          git -C "$source_root" checkout -q FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          echo "H5_PINNED_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
      - name: Build and check original Three.js V12, not a fixture
        run: |
          pnpm pilot build "$RUN_ID" cf-transport-ship
          pnpm pilot check "$RUN_ID"
      - name: Actual 3D natural mobile input, eight modes, fail and free retry
        id: real_v12
        shell: bash
        run: |
          set -o pipefail
          node tools/lean-pilot/cf-v12-native-qa.mjs 2>&1 | tee "$RUNNER_TEMP/cf-v12-natural.log"
      - name: Export only as INTERNAL playtest ZIP with Three.js attribution
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pnpm pilot export "$RUN_ID" > "$RUNNER_TEMP/cf-v12-export.json"
          mkdir -p "$RUNNER_TEMP/cf-v12-playtest"
          html=$(find "runs/$RUN_ID" -maxdepth 1 -name 'cf-transport-ship-*.html' -print -quit)
          test -n "$html"
          cp "$html" "$RUNNER_TEMP/cf-v12-playtest/index.html"
          cp "runs/$RUN_ID/workspace/game/LICENSE.three.txt" "$RUNNER_TEMP/cf-v12-playtest/LICENSE.three.txt"
          (cd "$RUNNER_TEMP/cf-v12-playtest" && zip -q "$RUNNER_TEMP/cf-v12-private-playtest.zip" index.html LICENSE.three.txt)
          sha256sum "$RUNNER_TEMP/cf-v12-private-playtest.zip" > "$RUNNER_TEMP/cf-v12-private-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cf-v12-internal-real3d-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/cf-v12-natural.log
            ${{ runner.temp }}/cf-v12-export.json
            ${{ runner.temp }}/cf-v12-private-playtest.zip
            ${{ runner.temp }}/cf-v12-private-sha256.txt
            runs/h5-cf-challenges-20261013/cf-v12-native-qa.json
            runs/h5-cf-challenges-20261013/screenshots/cf-v12-*.png
          retention-days: 7
          if-no-files-found: warn

  # V13 original map only. Builds exact pinned Three.js and then validates
  # original cargo depot geometry, native collisions and both actor NavGrid paths.
  cf-v13-original-depot-3d:
    if: github.event.pull_request.head.ref == 'feat/cf-v13-original-depot-map-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUN_ID: h5-cf-challenges-20261013
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - name: Install locked deps and actual Playwright Chromium
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Unit geometry topology, lint, syntax and typecheck
        run: |
          node --check tools/lean-pilot/cf-v13-depot-qa.mjs
          node --check templates/web-lite/h5-source-mobile-v1/cf-depot-layout.mjs
          node --check templates/web-lite/h5-source-mobile-v1/cf-depot-source.js
          node --test templates/web-lite/h5-source-mobile-v1/tests/*.test.mjs
          pnpm exec eslint tools/lean-pilot/cf-v13-depot-qa.mjs tools/lean-pilot/h5-mobile-build.mjs templates/web-lite/h5-source-mobile-v1/*.mjs templates/web-lite/h5-source-mobile-v1/*.js templates/web-lite/h5-source-mobile-v1/tests/*.test.mjs
          npm run pilot:typecheck
      - name: Clone immutable original 3D engine without changing upstream
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/cf-v13-pinned"
          mkdir -p "$source_root"
          git -C "$source_root" init -q
          git -C "$source_root" remote add origin https://github.com/riba2534/claude-opus-5-5-demo.git
          git -C "$source_root" fetch --no-tags --depth=1 origin 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          git -C "$source_root" checkout -q FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = 54adc1fb64155f9dd7c1c90ecae7b8185ac540b8
          echo "H5_PINNED_SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
      - name: Rebuild original ship and authored depot as real 3D H5
        run: |
          pnpm pilot build "$RUN_ID" cf-transport-ship
          pnpm pilot check "$RUN_ID"
      - name: Two real maps, native bots, actual touchscreen and reverse objective
        id: native_map
        shell: bash
        run: |
          set -o pipefail
          node tools/lean-pilot/cf-v13-depot-qa.mjs 2>&1 | tee "$RUNNER_TEMP/cf-v13-depot.log"
      - name: Export internal ONLY ZIP with original Three.js license
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          pnpm pilot export "$RUN_ID" > "$RUNNER_TEMP/cf-v13-export.json"
          mkdir -p "$RUNNER_TEMP/cf-v13-playtest"
          html=$(find "runs/$RUN_ID" -maxdepth 1 -name 'cf-transport-ship-*.html' -print -quit)
          test -n "$html"
          cp "$html" "$RUNNER_TEMP/cf-v13-playtest/index.html"
          cp "runs/$RUN_ID/workspace/game/LICENSE.three.txt" "$RUNNER_TEMP/cf-v13-playtest/LICENSE.three.txt"
          (cd "$RUNNER_TEMP/cf-v13-playtest" && zip -q "$RUNNER_TEMP/cf-v13-internal-playtest.zip" index.html LICENSE.three.txt)
          sha256sum "$RUNNER_TEMP/cf-v13-internal-playtest.zip" > "$RUNNER_TEMP/cf-v13-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cf-v13-original-depot-internal-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/cf-v13-depot.log
            ${{ runner.temp }}/cf-v13-export.json
            ${{ runner.temp }}/cf-v13-internal-playtest.zip
            ${{ runner.temp }}/cf-v13-sha256.txt
            runs/h5-cf-challenges-20261013/cf-v13-depot-qa.json
            runs/h5-cf-challenges-20261013/screenshots/cf-v13-*.png
          retention-days: 7
          if-no-files-found: warn

