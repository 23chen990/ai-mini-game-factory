name: Pelican V7 fast physical rules
on:
  pull_request:
    paths:
      - 'tools/lean-pilot/pelican-v2/**'
      - '.github/workflows/pelican-v7-fast.yml'
permissions:
  contents: read
concurrency:
  group: pelican-v7-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  physical-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Native collision, authored course and reward invariant tests
        run: |
          node --test tools/lean-pilot/pelican-v2/core.node.mjs tools/lean-pilot/pelican-v2/runtime/*.node.mjs
          node tools/lean-pilot/pelican-v2/difficulty-audit.mjs
