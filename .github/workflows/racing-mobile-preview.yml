name: Racing V3.4 private-scope mobile smoke preview
on:
  push:
    branches:
      - preview/racing-v34-dbf8603-mobile
    paths:
      - .github/workflows/racing-mobile-preview.yml
permissions:
  contents: write
  actions: read
jobs:
  make-phone-link:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract CI-verified standalone H5 (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38842246865 -R "${{ github.repository }}" \
            -n racing-v3-h5-dbf8603a50002957f060388e7b65ed67205f4430 \
            -D "$RUNNER_TEMP/racing-qa"
          python3 - <<'PY'
          import io, json, pathlib, hashlib, zipfile, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          package=root/'racing-qa/artifacts/racing-v3-delivery'
          build=json.loads((package/'build-racing.json').read_text())
          if build.get('publishable') is not False: raise SystemExit('Expected internal-only build')
          with zipfile.ZipFile(io.BytesIO((package/'qq-speed-v3-h5.zip').read_bytes())) as archive:
              html=archive.read('index.html').decode('utf8')
              css=archive.read('style.css').decode('utf8')
          anchor='<link rel="stylesheet" href="style.css">'
          if html.count(anchor)!=1: raise SystemExit('CSS anchor mismatch')
          standalone=html.replace(anchor,'<style>'+css+'</style>')
          sha=hashlib.sha256(standalone.encode('utf8')).hexdigest()
          if sha!=build['trialSha256'] or sha!='2dbb6bb07bfe1b8379ba0f3d696a5c8a0c5f334b2b462c97368ba764d9732b8e':
              raise SystemExit('Standalone file hash does not match certified CI build')
          pathlib.Path('index.html').write_text(standalone,encoding='utf8')
          pathlib.Path('PREVIEW_PROVENANCE.txt').write_text(
              'INTERNAL TEST ONLY - NOT A COMMERCIAL RELEASE\n'
              'original-game-commit=dbf8603a50002957f060388e7b65ed67205f4430\n'
              'sha256='+sha+'\n')
          print('Verified standalone:',sha)
          PY
      - name: Publish only to the independent, temporary preview branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PREVIEW_PROVENANCE.txt
          git commit -m "chore(racing-preview): copy SHA-verified internal H5 for phone testing"
          git push origin HEAD:refs/heads/preview/racing-v34-dbf8603-mobile
          echo "PHONE_TEST_URL=https://raw.githack.com/${GITHUB_REPOSITORY}/preview/racing-v34-dbf8603-mobile/index.html"
